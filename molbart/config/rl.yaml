defaults:
  - plugins:
    - deepspeed.yaml
  - logger: tensorboard.yaml
  - trainer: default.yaml
  # override config either in this file or using experiment config
  - _self_
  - experiment: null # experiment configs allow for version control of specific hyperparameters

output_directory: "grpo_logs"
deepspeed_config_path: "ds_config.json"

seed: 24
batch_size: 256
n_epochs: 50
limit_val_batches: 1.0
n_buckets: 1
n_gpus: 1
n_nodes: 1
acc_batches: 1
accelerator: null
check_val_every_n_epoch: 1

datamodule:
  - MolOptDataModule

data_path: null
vocabulary_path: bart_vocab_downstream.json
task: backward_prediction   # ["forward_prediction", "backward_prediction", "mol_opt"]]
augmentation_probability: 0.0
augmentation_strategy: null # Can be set to "all", "reactants", "products" when using synthesis datamodule
data_device: cuda

model_path: null
model_type: bart            # ["bart", "unified"]
learning_rate: 0.001
weight_decay: 0.1
clip_grad: 0.0
d_model: 512
n_layers: 6
n_heads: 8
d_feedforward: 2048
train_tokens: null
train_mode: training
n_beams: 3

rl:
  learning_rate: 1.0e-5
  ppo_epochs: 4
  clip_param: 0.2
  kl_coeff: 0.02
  g_samples: 10

resume: false

callbacks:
  - LearningRateMonitor
  - ModelCheckpoint:
    - period: 1
    - save_top_k: 3
    - monitor: accuracy
    - mode: "max"
  - ValidationScoreCallback
  - StepCheckpoint
  - OptLRMonitor

scorers:
  - FractionInvalidScore
  - TopKAccuracyScore
