[project]
name = "Chemformer"
version = "0.1.0"
requires-python = ">=3.9,<3.10"
dependencies = [
	"torch>=2.0",
	"pysmilesutils",
	"hydra-core>=1.3.2",
	"hydra-colorlog>=1.2.0",
	"hydra-optuna-sweeper>=1.2.0",
	"fastapi==0.98.0",
	"pandas==1.3.5",
	"rdkit>=2025.3.5",
	"lightning>=2.5.3",
]

[tool.uv.sources]
pysmilesutils = { git = "https://github.com/MolecularAI/pysmilesutils" }

[tool.poetry]
name = "chemformer"
version = "2.1.0"
description = "Smiles-based synthesis prediction."
authors = ["Irwin, Ross <ross.irwin1@astrazeneca.com>"]
maintainers = [
    "Westerlund, Annie <annie.westerlund@astrazeneca.com>",
    "Saigiridharan, Lakshidaa <lakshidaa.saigiridharan@astrazeneca.com>",
    "Peter Hartog <peter.hartog@astrazeneca.com>",
    "Genheden, Samuel <samuel.genheden@astrazeneca.com>",
]
license = "Apache 2.0"

packages = [{ include = "molbart" }]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
